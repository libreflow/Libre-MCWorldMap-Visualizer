[package]
name = "libre-mcworldmap-visualizer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "libre_mcworldmap_visualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastanvil = "0.31"
fastnbt = "2"
rayon = "1"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["sync"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/
# [profile.release]
# codegen-units = 1
# lto = true
# opt-level = 3
# panic = "abort"
# strip = true
